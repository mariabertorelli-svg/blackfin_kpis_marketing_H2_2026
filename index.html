<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackfin Marketing Dashboard H2 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg:#0d1117; --s1:#161b22; --s2:#21262d; --border:#30363d;
  --text:#e6edf3; --muted:#8b949e;
  --blue:#58a6ff; --green:#3fb950; --purple:#bc8cff;
  --orange:#f0883e; --teal:#0ea5e9; --yellow:#d29922; --red:#f85149;
  --r:12px; --rs:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px;}

/* ── HEADER ── */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:14px;}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.3px;}
.header h1 span{color:var(--teal);}
.header p{color:var(--muted);font-size:13px;margin-top:3px;}
.phase-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#1e40af22,#0ea5e922);border:1px solid #0ea5e940;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--teal);letter-spacing:.5px;text-transform:uppercase;}
.phase-badge::before{content:'⚡';}

/* ── URL BAR ── */
.url-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:10px 16px;margin-bottom:14px;}
.url-bar input{background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 12px;font-size:12px;flex:1;min-width:200px;}
.url-bar input:focus{outline:2px solid var(--teal);border-color:transparent;}
.btn{display:inline-flex;align-items:center;gap:5px;background:var(--teal);color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s;}
.btn:hover{background:#0891c2;}

/* ── STATUS ── */
#status-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:22px;min-height:20px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-live{background:var(--green);animation:pulse 2s infinite;}
.dot-load{background:var(--yellow);animation:pulse 1s infinite;}
.dot-err{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ── SECTION ── */
.section{margin-bottom:32px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.sec-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.section-header h2{font-size:15px;font-weight:700;}
.section-header small{color:var(--muted);font-size:12px;margin-left:4px;}

/* ── GROUPS GRID ── */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}

/* ── GROUP CARD ── */
.group-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color .2s;}
.group-card:hover{border-color:#40464e;}
.group-card-header{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;}
.group-card-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.group-card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}
.group-card-body{padding:0 16px 14px;}

/* MAIN KPI */
.kpi-row{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:6px;}
.kpi-real{font-size:38px;font-weight:800;line-height:1;letter-spacing:-1.5px;}
.kpi-target-wrap{text-align:right;}
.kpi-target-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.kpi-target-val{font-size:20px;font-weight:600;}

/* PROGRESS */
.prog-bg{height:5px;background:var(--s2);border-radius:99px;overflow:hidden;margin:8px 0;}
.prog-fill{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.4,0,.2,1);}
.prog-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:12px;}
.badge{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;}
.badge-g{background:#3fb95020;color:var(--green);}
.badge-y{background:#d2992220;color:var(--yellow);}
.badge-r{background:#f8514920;color:var(--red);}
.badge-b{background:#1e6fe820;color:var(--blue);}

/* REGIONS */
.regions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.region-pill{background:var(--s2);border-radius:7px;padding:8px 10px;text-align:center;}
.region-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;}
.region-val{font-size:16px;font-weight:700;}

/* CHART inside card */
.mini-chart-wrap{height:90px;position:relative;margin-top:4px;}

/* ── COMPARISON CARD (real vs obj side by side) ── */
.cmp-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;}
.cmp-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);}
.cmp-row{display:flex;align-items:center;gap:10px;}
.cmp-label{font-size:12px;color:var(--muted);width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cmp-bar-bg{flex:1;height:16px;background:var(--s2);border-radius:5px;overflow:hidden;position:relative;}
.cmp-bar-fill{height:100%;border-radius:5px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:600;color:#fff;transition:width .8s cubic-bezier(.4,0,.2,1);}
.cmp-val{font-size:12px;font-weight:700;width:36px;text-align:right;}

/* ── CHART SECTION ── */
.chart-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;margin-top:14px;}
.chart-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:18px;}
.chart-card h3{font-size:13px;font-weight:600;margin-bottom:3px;}
.chart-card small{font-size:11px;color:var(--muted);display:block;margin-bottom:14px;}
.chart-wrap{height:180px;position:relative;}

/* ── TABLE ── */
.table-outer{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-top:14px;}
.table-toolbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.table-toolbar label{font-size:12px;color:var(--muted);font-weight:600;}
.table-toolbar select{background:var(--s2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:5px 10px;font-size:12px;cursor:pointer;}
.table-wrap{overflow-x:auto;max-height:380px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;}
thead{position:sticky;top:0;z-index:2;}
.th-group{background:#1c2230;color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;padding:6px 14px;border-bottom:1px solid var(--border);text-align:center;}
th{background:var(--s2);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--s2);}
td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
td.mes-cell{font-weight:600;color:var(--text);}
.last-updated{font-size:11px;color:var(--muted);text-align:right;margin-top:8px;}

@media(max-width:700px){.groups-grid{grid-template-columns:1fr}.chart-grid{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div>
    <h1>Marketing Dashboard <span>Blackfin</span></h1>
    <p>KPIs H2 2026 · Sector Asegurador · Iberia · LATAM · México</p>
  </div>
  <div class="phase-badge">Fase 2: La Aceleración</div>
</div>

<!-- URL BAR -->
<div class="url-bar">
  <input type="text" id="sheetUrl" placeholder="URL CSV de Google Sheets"
    value="https://docs.google.com/spreadsheets/d/e/2PACX-1vTSpvtTvCI88FWxlNyo4zEWx-dWCQoWzBYA5mdQQ8VyIFngoP5mwaBZkY_I0ixOFM4q4h4m8g00vO-Q/pub?output=csv">
  <button class="btn" onclick="loadData()">↻ Actualizar</button>
  <span id="month-sel-wrap" style="display:none;margin-left:8px;">
    <select id="monthSel" onchange="render()" style="background:var(--s2);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 10px;font-size:12px;cursor:pointer;"></select>
  </span>
</div>

<!-- STATUS -->
<div id="status-bar">
  <div class="dot dot-load" id="sdot"></div>
  <span id="stxt">Conectando con Google Sheets...</span>
</div>

<!-- DASHBOARD (populated by JS) -->
<div id="dashboard"></div>

<div class="last-updated" id="lastUpdated"></div>

<script>
// ══════════════════════════════════════════════════════════════════════════
// CONFIGURACIÓN DE GRUPOS
// Agrupa las columnas de la sheet en secciones lógicas del dashboard
// ══════════════════════════════════════════════════════════════════════════
const SECTIONS = [
  {
    id: 'demanda',
    label: 'Generación de Demanda',
    sublabel: 'MQL · SQL · Oportunidades · Clientes ganados',
    icon: '🎯',
    iconBg: '#1e6fe822',
    groups: [
      {
        id:'mql', label:'MQL', sublabel:'Marketing Qualified Leads',
        color:'#58a6ff', icon:'🎯', iconBg:'#1e6fe822',
        main:'mql', target:'mql_objetivo',
        regions:[{col:'mql_iberia',label:'Iberia'},{col:'mql_latam',label:'LATAM'},{col:'mql_mx',label:'México'}],
      },
      {
        id:'sql', label:'SQL', sublabel:'Sales Qualified Leads',
        color:'#3fb950', icon:'🤝', iconBg:'#3fb95022',
        main:'sql', target:'sql_objetivo',
        regions:[{col:'sql_iberia',label:'Iberia'},{col:'sql_latam',label:'LATAM'},{col:'sql_mx',label:'México'}],
      },
      {
        id:'opor', label:'Oportunidades', sublabel:'Nuevas oportunidades',
        color:'#bc8cff', icon:'🚀', iconBg:'#bc8cff22',
        main:'oportunidades', target:'Objetivo_Nuevos_oportunidades', regions:[{col:'Nuevos_oportunidades_iberia',label:'Iberia'},{col:'Nuevos_oportunidades_latam',label:'LATAM'},{col:'Nuevos_oportunidades_mx',label:'México'}],
      },
      {
        id:'gan', label:'Clientes Ganados', sublabel:'Contratos cerrados',
        color:'#f0883e', icon:'🏆', iconBg:'#f0883e22',
        main:'Clientes_ganados', target:'Objetivo_Clientes_ganados',
        regions:[],
      },
    ],
  },
  {
    id: 'crm',
    label: 'CRM & Base de Datos',
    sublabel: 'Adopción · Contactos · Campañas · Efectividad',
    icon: '🗂️',
    iconBg: '#bc8cff22',
    groups: [
      {
        id:'crm_adopcion', label:'CRM Adopción', sublabel:'Uso y calidad del CRM (%)',
        color:'#0ea5e9', icon:'🗂️', iconBg:'#0ea5e922',
        main:'crm_adopcion', target:null, regions:[],
        extra:[{col:'crm_calidad_datos',label:'Calidad datos'}],
      },
      {
        id:'crm_contactos', label:'Contactos CRM', sublabel:'Aseguradoras en base de datos',
        color:'#a78bfa', icon:'👥', iconBg:'#a78bfa22',
        main:'contactos_crm', target:null,
        regions:[{col:'crm_contactos_iberia',label:'Iberia'},{col:'crm_contactos_latam',label:'LATAM'},{col:'crm_contactos_mx',label:'México'}],
      },
      {
        id:'crm_camp', label:'Campañas', sublabel:'Campañas ejecutadas por región',
        color:'#fb923c', icon:'📧', iconBg:'#fb923c22',
        main:'crm_campañas', target:null,
        regions:[{col:'crm_campañas_iberia',label:'Iberia'},{col:'crm_campañas_latam',label:'LATAM'},{col:'crm_campañas_mx',label:'México'}],
        aliases:{'crm_campaas':'crm_camp','crm_campañas':'crm_camp'},
      },
      {
        id:'crm_resp', label:'Respuesta Campañas', sublabel:'Tasa de respuesta por región (%)',
        color:'#34d399', icon:'📬', iconBg:'#34d39922',
        main:'crm_respuesta campañas', target:null,
        regions:[{col:'crm_respuesta_campañas_iberia',label:'Iberia'},{col:'crm_respuesta_campañas_latam',label:'LATAM'},{col:'crm_respuesta_campañas_mx',label:'México'}],
      },
    ],
  },
  {
    id: 'digital',
    label: 'Visibilidad Digital',
    sublabel: 'Web · LinkedIn',
    icon: '📣',
    iconBg: '#3fb95022',
    groups: [
      {
        id:'web', label:'Tráfico Web', sublabel:'Visitas orgánicas',
        color:'#39d353', icon:'🌐', iconBg:'#39d35322',
        main:'trafico_web', target:'trafico_web_obj', regions:[],
      },
      {
        id:'li_imp', label:'LinkedIn Impresiones', sublabel:'Alcance en LinkedIn España',
        color:'#0ea5e9', icon:'💼', iconBg:'#0ea5e922',
        main:'linkedin_impresiones', target:'linkedin_impresiones_obj', regions:[],
      },
      {
        id:'li_eng', label:'LinkedIn Engagement', sublabel:'Tasa de engagement (%)',
        color:'#58a6ff', icon:'💬', iconBg:'#1e6fe822',
        main:'linkedin_engagement', target:'linkedin_engagement_objetivos', regions:[],
      },
      {id:'seguidores', label:'Seguidores', sublabel:'Seguidores totales en LinkedIn', color:'#a78bfa', icon:'👤', iconBg:'#a78bfa22', main:'seguidores', target:null, regions:[]},{id:'impresiones', label:'Impresiones', sublabel:'Impresiones totales en LinkedIn', color:'#fbbf24', icon:'👁', iconBg:'#fbbf2422', main:'impresiones', target:null, regions:[]},
    ],
  },
];

// ══════════════════════════════════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════════════════════════════════
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTSpvtTvCI88FWxlNyo4zEWx-dWCQoWzBYA5mdQQ8VyIFngoP5mwaBZkY_I0ixOFM4q4h4m8g00vO-Q/pub?output=csv';
let allHeaders = [];
let allData    = [];
let chartInst  = {};
let colMap     = {}; // lowercased + normalized → original header

// ══════════════════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════════════════
function norm(s){ return s.toLowerCase().replace(/ñ/g,'n').replace(/[áàä]/g,'a').replace(/[éèë]/g,'e').replace(/[íìï]/g,'i').replace(/[óòö]/g,'o').replace(/[úùü]/g,'u').trim(); }

function g(row, colName){
  if(!colName) return undefined;
  // Try exact
  if(row[colName] !== undefined) return row[colName];
  // Try normalized
  const n = norm(colName);
  const found = Object.keys(row).find(k => norm(k) === n);
  return found ? row[found] : undefined;
}

function fmtN(v, unit=''){
  if(v === undefined || v === null || v === '') return '—';
  if(typeof v !== 'number') return v;
  const s = Math.abs(v) >= 1000 ? v.toLocaleString('es-ES',{maximumFractionDigits:0}) : v%1!==0 ? v.toFixed(1) : String(v);
  return s + (unit ? ' '+unit : '');
}

function pct(real, target){
  if(!target || target === 0) return null;
  return Math.round((real/target)*100);
}

function badgeCls(p, invert=false){
  if(p === null) return 'badge-b';
  if(invert){ return p<=80?'badge-g':p<=110?'badge-y':'badge-r'; }
  return p>=85?'badge-g':p>=60?'badge-y':'badge-r';
}
function badgeTxt(p){ return p===null?'Sin meta':p>=85?'✓ En meta':p>=60?'⚠ Cerca':'✗ Bajo'; }

function setStatus(type, msg){
  document.getElementById('sdot').className = 'dot dot-'+type;
  document.getElementById('stxt').textContent = msg;
}

// ══════════════════════════════════════════════════════════════════════════
// PARSE CSV
// ══════════════════════════════════════════════════════════════════════════
function parseCSV(csv){
  const text = csv.replace(/\r\n/g,'\n').replace(/\r/g,'\n');

  function splitRow(line){
    const fields=[]; let f=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){f+='"';i++;}else{inQ=!inQ;}}
      else if(c===','&&!inQ){fields.push(f.trim());f='';}
      else f+=c;
    }
    fields.push(f.trim());
    return fields;
  }

  // Split lines respecting quotes
  const rawLines=[];
  let cur=''; let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(inQ&&text[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(c==='\n'&&!inQ){rawLines.push(cur);cur='';}
    else cur+=c;
  }
  if(cur) rawLines.push(cur);

  const headers = splitRow(rawLines[1]).map(h=>h.replace(/^"|"$/g,'').trim());
  const data=[];
  for(let i=2;i<rawLines.length;i++){
    const line=rawLines[i].trim();
    if(!line) continue;
    const vals=splitRow(line);
    const row={};
    headers.forEach((h,idx)=>{
      const raw=(vals[idx]||'').replace(/^"|"$/g,'').trim();
      const num=parseFloat(raw.replace(/,/g,'.'));
      row[h]=raw===''?'':((!isNaN(num)&&raw!=='')?num:raw);
    });
    if(row[headers[0]]===''||row[headers[0]]===undefined) continue;
    data.push(row);
  }
  return{headers,data};
}

// ══════════════════════════════════════════════════════════════════════════
// LOAD
// ══════════════════════════════════════════════════════════════════════════
async function loadData(){
  const url = document.getElementById('sheetUrl').value.trim() || SHEET_URL;
  setStatus('load','Cargando datos desde Google Sheets...');
  try{
    const res=await fetch(url+'&_t='+Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    const csv=await res.text();
    const{headers,data}=parseCSV(csv);
    if(!data.length) throw new Error('Sin datos. ¿Está publicada la hoja como CSV?');
    allHeaders=headers;
    allData=data;
    localStorage.setItem('bf_url',url);

    // Month selector
    const sel=document.getElementById('monthSel');
    const labelCol=headers[0];
    sel.innerHTML=data.map((r,i)=>`<option value="${i}">${r[labelCol]||'Fila '+(i+1)}</option>`).join('');
    const monthNames=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];const currentMonthName=monthNames[new Date().getMonth()];let defaultIdx=data.findIndex(r=>norm(String(r[labelCol]))===currentMonthName);if(defaultIdx===-1) defaultIdx=data.length-1;sel.value=String(defaultIdx); // default: mes en curso
    document.getElementById('month-sel-wrap').style.display='';

    render();
    setStatus('live',`${data.length} meses cargados · ${headers.length} columnas · actualizado ${new Date().toLocaleTimeString('es-ES')}`);
    document.getElementById('lastUpdated').textContent='🕐 '+new Date().toLocaleString('es-ES');
  }catch(e){
    setStatus('err','Error: '+e.message);
    console.error(e);
  }
}

// ══════════════════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════════════════
function render(){
  if(!allData.length) return;
  const mIdx = parseInt(document.getElementById('monthSel').value);
  const row  = allData[mIdx];
  const labelCol = allHeaders[0];
  const months   = allData.map(r=>String(r[labelCol]));

  // Destroy old charts
  Object.values(chartInst).forEach(c=>{try{c.destroy();}catch(e){}});
  chartInst={};

  const dash = document.getElementById('dashboard');
  dash.innerHTML = '';

  SECTIONS.forEach(sec => {
    const secEl = document.createElement('div');
    secEl.className = 'section';

    // Section header
    secEl.innerHTML = `
      <div class="section-header">
        <div class="sec-icon" style="background:${sec.iconBg}">${sec.icon}</div>
        <div>
          <h2>${sec.label}</h2>
          <small>${sec.sublabel}</small>
        </div>
      </div>`;

    // Groups grid
    const grid = document.createElement('div');
    grid.className = 'groups-grid';

    sec.groups.forEach(grp => {
      const realVal   = g(row, grp.main);
      const targetVal = g(row, grp.target);
      const p         = (typeof realVal==='number' && typeof targetVal==='number') ? pct(realVal, targetVal) : null;
      const bCls      = badgeCls(p, grp.invertColor||false);
      const bTxt      = badgeTxt(p);
      const barW      = p!==null ? Math.min(Math.max(p,0),100) : (realVal?50:0);
      const unit      = grp.unit||'';

      // Trend sparkline data
      const sparkData = allData.map(r => typeof g(r,grp.main)==='number' ? g(r,grp.main) : null);
      const sparkTarget = grp.target ? allData.map(r => typeof g(r,grp.target)==='number' ? g(r,grp.target) : null) : null;

      const chartId = `chart_${grp.id}`;

      // Regions HTML
      let regHtml = '';
      if(grp.regions && grp.regions.length){
        regHtml = `<div class="regions">
          ${grp.regions.map(reg=>{
            const v = g(row, reg.col);
            return `<div class="region-pill">
              <div class="region-label">${reg.label}</div>
              <div class="region-val" style="color:${grp.color}">${fmtN(v,unit)}</div>
            </div>`;
          }).join('')}
        </div>`;
      }

      // Extra cols (e.g. crm_calidad_datos next to crm_adopcion)
      let extraHtml = '';
      if(grp.extra && grp.extra.length){
        extraHtml = `<div class="regions" style="grid-template-columns:repeat(${grp.extra.length},1fr)">
          ${grp.extra.map(ex=>{
            const v = g(row, ex.col);
            return `<div class="region-pill" style="grid-column:span 1">
              <div class="region-label">${ex.label}</div>
              <div class="region-val" style="color:${grp.color}">${fmtN(v,unit)}</div>
            </div>`;
          }).join('')}
        </div>`;
      }

      // Target display
      const targetDisplay = typeof targetVal==='number'
        ? `<div class="kpi-target-wrap"><div class="kpi-target-label">Objetivo</div><div class="kpi-target-val" style="color:var(--muted)">${fmtN(targetVal,unit)}</div></div>`
        : '';

      const card = document.createElement('div');
      card.className = 'group-card';
      card.innerHTML = `
        <div class="group-card-header">
          <div class="group-card-icon" style="background:${grp.iconBg}">${grp.icon}</div>
          <div>
            <div class="group-card-title">${grp.label}</div>
            <div style="font-size:11px;color:var(--muted)">${grp.sublabel}</div>
          </div>
        </div>
        <div class="group-card-body">
          <div class="kpi-row">
            <div class="kpi-real" style="color:${grp.color}">${fmtN(realVal,unit)}</div>
            ${targetDisplay}
          </div>
          ${p!==null||typeof realVal==='number'?`
          <div class="prog-bg">
            <div class="prog-fill" id="bar_${grp.id}" style="width:0%;background:${grp.color}"></div>
          </div>
          <div class="prog-meta">
            <span>${p!==null?p+'% de objetivo':'Sin objetivo definido'}</span>
            <span class="badge ${bCls}">${bTxt}</span>
          </div>`:''}
          ${regHtml}
          ${extraHtml}
          <div class="mini-chart-wrap"><canvas id="${chartId}"></canvas></div>
        </div>`;

      grid.appendChild(card);

      // Animate bar after DOM insert
      setTimeout(()=>{
        const barEl=document.getElementById('bar_'+grp.id);
        if(barEl) barEl.style.width=barW+'%';
      },100);

      // Mini sparkline
      setTimeout(()=>{
        const ctx=document.getElementById(chartId);
        if(!ctx) return;
        const datasets=[{
          label:grp.label, data:sparkData,
          borderColor:grp.color, backgroundColor:grp.color+'18',
          borderWidth:2, fill:true, tension:0.4,
          pointRadius:3, pointBackgroundColor:grp.color,
          spanGaps:true,
        }];
        if(sparkTarget){
          datasets.push({
            label:'Objetivo', data:sparkTarget,
            borderColor:'#8b949e', borderDash:[4,3],
            borderWidth:1.5, fill:false, tension:0,
            pointRadius:0, spanGaps:true,
          });
        }
        chartInst[chartId]=new Chart(ctx.getContext('2d'),{
          type:'line',
          data:{labels:months,datasets},
          options:{
            responsive:true,maintainAspectRatio:false,
            plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,
              callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmtN(ctx.raw,unit)}`}}},
            scales:{
              x:{grid:{color:'#30363d44'},ticks:{color:'#8b949e',font:{size:9}}},
              y:{grid:{color:'#30363d44'},ticks:{color:'#8b949e',font:{size:9}},beginAtZero:false},
            },
          }
        });
      },150);
    });

    secEl.appendChild(grid);
    dash.appendChild(secEl);
  });

  // ── FULL TABLE ────────────────────────────────────────────────────────
  const tableSec = document.createElement('div');
  tableSec.className='section';
  tableSec.innerHTML=`
    <div class="section-header">
      <div class="sec-icon" style="background:#30363d">📋</div>
      <div><h2>Todos los datos</h2><small>Vista completa de la hoja · todas las columnas · todos los meses</small></div>
    </div>
    <div class="table-outer">
      <div class="table-toolbar">
        <label>Filtrar por mes:</label>
        <select id="rowFilter" onchange="filterTable()">
          <option value="">— Todos —</option>
          ${allData.map((r,i)=>`<option value="${i}">${r[allHeaders[0]]}</option>`).join('')}
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr id="tHead"></tr></thead>
          <tbody id="tBody"></tbody>
        </table>
      </div>
    </div>`;
  dash.appendChild(tableSec);

  // Build table headers
  document.getElementById('tHead').innerHTML =
    `<th style="position:sticky;left:0;z-index:3;">${allHeaders[0]}</th>` +
    allHeaders.slice(1).map(h=>`<th>${h}</th>`).join('');
  renderTableRows(allData);
}

function renderTableRows(data){
  document.getElementById('tBody').innerHTML = data.map(row=>{
    return `<tr>
      <td class="mes-cell" style="position:sticky;left:0;background:var(--s1);z-index:1;">${row[allHeaders[0]]||'—'}</td>
      ${allHeaders.slice(1).map(h=>{
        const v=row[h];
        const isNum=typeof v==='number';
        return `<td class="${isNum?'num':''}">${isNum?v.toLocaleString('es-ES',{maximumFractionDigits:2}):(v||'—')}</td>`;
      }).join('')}
    </tr>`;
  }).join('');
}

function filterTable(){
  const idx=document.getElementById('rowFilter').value;
  renderTableRows(idx===''?allData:[allData[parseInt(idx)]]);
}

// ══════════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════════
window.addEventListener('load',()=>{
  const saved=localStorage.getItem('bf_url');
  if(saved) document.getElementById('sheetUrl').value=saved;
  loadData();
});
</script>
</body>
</html>
