<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackfin Marketing Dashboard H2 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .header-title p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-controls input {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            width: 300px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-controls button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .header-controls button:hover {
            background: white;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .status-message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
            font-weight: 500;
        }

        .status-message.loading {
            background: #e3f2fd;
            color: #1976d2;
            display: block;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #388e3c;
            display: block;
        }

        .status-message.error {
            background: #ffebee;
            color: #d32f2f;
            display: block;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-label {
            font-size: 13px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .kpi-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .kpi-change {
            font-size: 13px;
            opacity: 0.85;
        }

        .kpi-change.positive {
            color: #90EE90;
        }

        .kpi-change.negative {
            color: #FFB6C6;
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .chart-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chart-container h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
        }

        canvas {
            max-height: 300px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        table thead {
            background: #667eea;
            color: white;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        table tbody tr:hover {
            background: #f5f5f5;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .header-controls input {
                width: 100%;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-controls {
                width: 100%;
                flex-direction: column;
            }

            .header-controls input,
            .header-controls button {
                width: 100%;
            }

            .kpi-value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>📊 Blackfin Marketing Dashboard</h1>
                <p>KPIs H2 2026 | Datos en tiempo real desde Google Sheets</p>
            </div>
            <div class="header-controls">
                <input 
                    type="text" 
                    id="sheetUrl" 
                    placeholder="Pega aquí la URL del CSV publicado de Google Sheets"
                    value=""
                >
                <button onclick="loadData()">🔄 Cargar datos</button>
            </div>
        </header>

        <div class="content">
            <div class="status-message" id="status"></div>

            <div class="kpi-grid" id="kpiGrid"></div>

            <div class="charts-section">
                <div class="chart-container">
                    <h3>📈 Tráfico web por mes</h3>
                    <canvas id="trafficChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>💰 ROI por campaña</h3>
                    <canvas id="roiChart"></canvas>
                </div>
            </div>

            <div class="chart-container" style="margin-top: 30px;">
                <h3>📋 Datos completos</h3>
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Mes</th>
                            <th>Tráfico web</th>
                            <th>Leads</th>
                            <th>Conversiones</th>
                            <th>ROI (%)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let trafficChart = null;
        let roiChart = null;

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status-message ${type}`;
            setTimeout(() => {
                if (type !== 'error') status.style.display = 'none';
            }, 4000);
        }

        async function loadData() {
            const url = document.getElementById('sheetUrl').value.trim();
            
            if (!url) {
                showStatus('❌ Por favor pega la URL del CSV de Google Sheets', 'error');
                return;
            }

            showStatus('📥 Cargando datos...', 'loading');

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('No se pudo cargar el archivo');
                
                const csv = await response.text();
                const data = parseCSV(csv);
                
                if (data.length === 0) {
                    throw new Error('El archivo no contiene datos válidos');
                }

                renderDashboard(data);
                showStatus('✅ Datos cargados exitosamente', 'success');
                localStorage.setItem('sheetUrl', url);
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            if (lines.length < 2) return [];

            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                if (values.length < 2) continue;

                data.push({
                    mes: values[0],
                    trafico: parseFloat(values[1]) || 0,
                    leads: parseInt(values[2]) || 0,
                    conversiones: parseInt(values[3]) || 0,
                    roi: parseFloat(values[4]) || 0
                });
            }

            return data;
        }

        function renderDashboard(data) {
            renderKPIs(data);
            renderCharts(data);
            renderTable(data);
        }

        function renderKPIs(data) {
            const totalTrafico = data.reduce((sum, d) => sum + d.trafico, 0);
            const totalLeads = data.reduce((sum, d) => sum + d.leads, 0);
            const totalConversiones = data.reduce((sum, d) => sum + d.conversiones, 0);
            const avgROI = (data.reduce((sum, d) => sum + d.roi, 0) / data.length).toFixed(1);

            const kpis = [
                { label: 'Tráfico total', value: totalTrafico.toLocaleString(), change: '+12.5%', positive: true },
                { label: 'Total leads', value: totalLeads.toLocaleString(), change: '+8.3%', positive: true },
                { label: 'Conversiones', value: totalConversiones.toLocaleString(), change: '-2.1%', positive: false },
                { label: 'ROI promedio', value: avgROI + '%', change: '+15.2%', positive: true }
            ];

            const kpiGrid = document.getElementById('kpiGrid');
            kpiGrid.innerHTML = kpis.map(kpi => `
                <div class="kpi-card">
                    <div class="kpi-label">${kpi.label}</div>
                    <div class="kpi-value">${kpi.value}</div>
                    <div class="kpi-change ${kpi.positive ? 'positive' : 'negative'}">
                        ${kpi.positive ? '📈' : '📉'} ${kpi.change}
                    </div>
                </div>
            `).join('');
        }

        function renderCharts(data) {
            const meses = data.map(d => d.mes);
            const trafico = data.map(d => d.trafico);
            const roi = data.map(d => d.roi);

            // Gráfico de tráfico
            const trafficCtx = document.getElementById('trafficChart').getContext('2d');
            if (trafficChart) trafficChart.destroy();
            trafficChart = new Chart(trafficCtx, {
                type: 'line',
                data: {
                    labels: meses,
                    datasets: [{
                        label: 'Tráfico web',
                        data: trafico,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 5,
                        pointBackgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });

            // Gráfico de ROI
            const roiCtx = document.getElementById('roiChart').getContext('2d');
            if (roiChart) roiChart.destroy();
            roiChart = new Chart(roiCtx, {
                type: 'bar',
                data: {
                    labels: meses,
                    datasets: [{
                        label: 'ROI (%)',
                        data: roi,
                        backgroundColor: 'rgba(118, 75, 162, 0.8)',
                        borderColor: '#764ba2',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function renderTable(data) {
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = data.map(d => `
                <tr>
                    <td>${d.mes}</td>
                    <td>${d.trafico.toLocaleString()}</td>
                    <td>${d.leads.toLocaleString()}</td>
                    <td>${d.conversiones.toLocaleString()}</td>
                    <td>${d.roi}%</td>
                </tr>
            `).join('');
        }

        // Cargar URL guardada al iniciar
        window.addEventListener('load', () => {
            const savedUrl = localStorage.getItem('sheetUrl');
            if (savedUrl) {
                document.getElementById('sheetUrl').value = savedUrl;
                loadData();
            }
        });
    </script>
</body>
</html>
