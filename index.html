<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackfin Marketing Dashboard H2 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title h1 {
            font-size: 32px;
            margin-bottom: 5px;
        }

        .header-title p {
            font-size: 14px;
            opacity: 0.9;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-controls input {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            width: 300px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .header-controls button {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .header-controls button:hover {
            background: white;
            color: #667eea;
        }

        .content {
            padding: 30px;
        }

        .status-message {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
            font-weight: 500;
        }

        .status-message.loading {
            background: #e3f2fd;
            color: #1976d2;
            display: block;
        }

        .status-message.success {
            background: #e8f5e9;
            color: #388e3c;
            display: block;
        }

        .status-message.error {
            background: #ffebee;
            color: #d32f2f;
            display: block;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s ease;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
        }

        .kpi-label {
            font-size: 12px;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi-change {
            font-size: 12px;
            opacity: 0.85;
        }

        .kpi-change.positive {
            color: #90EE90;
        }

        .kpi-change.negative {
            color: #FFB6C6;
        }

        .charts-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .chart-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .chart-container h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 18px;
            text-align: center;
        }

        canvas {
            max-height: 300px;
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        table thead {
            background: #667eea;
            color: white;
            position: sticky;
            top: 0;
        }

        table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
            white-space: nowrap;
        }

        table tbody tr:hover {
            background: #f5f5f5;
        }

        table tbody tr:last-child td {
            border-bottom: none;
        }

        .section-title {
            font-size: 24px;
            color: #667eea;
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .header-controls input {
                width: 100%;
            }

            .charts-section {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-controls {
                width: 100%;
                flex-direction: column;
            }

            .header-controls input,
            .header-controls button {
                width: 100%;
            }

            .kpi-value {
                font-size: 22px;
            }

            table th, table td {
                font-size: 10px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <h1>📊 Blackfin Marketing Dashboard</h1>
                <p>KPIs H2 2026 | Todos los datos en tiempo real</p>
            </div>
            <div class="header-controls">
                <input 
                    type="text" 
                    id="sheetUrl" 
                    placeholder="Pega aquí la URL del CSV publicado de Google Sheets"
                    value=""
                >
                <button onclick="loadData()">🔄 Cargar datos</button>
            </div>
        </header>

        <div class="content">
            <div class="status-message" id="status"></div>

            <div class="section-title">📈 KPIs Principales</div>
            <div class="kpi-grid" id="kpiGrid"></div>

            <div class="section-title">📊 Gráficos</div>
            <div class="charts-section" id="chartsSection"></div>

            <div class="section-title">📋 Todos los datos</div>
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead id="tableHead"></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let charts = {};

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status-message ${type}`;
            setTimeout(() => {
                if (type !== 'error') status.style.display = 'none';
            }, 4000);
        }

        async function loadData() {
            const url = document.getElementById('sheetUrl').value.trim();
            
            if (!url) {
                showStatus('❌ Por favor pega la URL del CSV de Google Sheets', 'error');
                return;
            }

            showStatus('📥 Cargando datos...', 'loading');

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('No se pudo cargar el archivo');
                
                const csv = await response.text();
                const { headers, data } = parseCSV(csv);
                
                if (data.length === 0) {
                    throw new Error('El archivo no contiene datos válidos');
                }

                renderDashboard(headers, data);
                showStatus('✅ Datos cargados exitosamente', 'success');
                localStorage.setItem('sheetUrl', url);
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            if (lines.length < 2) return { headers: [], data: [] };

            const headers = lines[0].split('\t').map(h => h.trim());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split('\t').map(v => v.trim());
                if (values.length < 2 || !values[0]) continue;

                const row = {};
                headers.forEach((header, idx) => {
                    const val = values[idx] || '';
                    row[header] = isNaN(val) ? val : parseFloat(val);
                });
                data.push(row);
            }

            return { headers, data };
        }

        function renderDashboard(headers, data) {
            renderKPIs(headers, data);
            renderCharts(headers, data);
            renderTable(headers, data);
        }

        function renderKPIs(headers, data) {
            const numericColumns = headers.filter(h => {
                const values = data.map(d => d[h]);
                return values.some(v => !isNaN(v) && v !== '');
            }).slice(1, 5); // Primeras 4 columnas numéricas

            const kpis = numericColumns.map(col => {
                const values = data.map(d => parseFloat(d[col]) || 0).filter(v => v !== 0);
                const total = values.reduce((a, b) => a + b, 0);
                const avg = values.length > 0 ? (total / values.length).toFixed(1) : 0;
                
                const change = data.length > 1 
                    ? (((parseFloat(data[data.length-1][col]) - parseFloat(data[0][col])) / parseFloat(data[0][col])) * 100).toFixed(1)
                    : 0;

                return {
                    label: col,
                    value: total > 100 ? total.toLocaleString() : avg,
                    change: `${change > 0 ? '+' : ''}${change}%`,
                    positive: change > 0
                };
            });

            const kpiGrid = document.getElementById('kpiGrid');
            kpiGrid.innerHTML = kpis.map(kpi => `
                <div class="kpi-card">
                    <div class="kpi-label">${kpi.label}</div>
                    <div class="kpi-value">${kpi.value}</div>
                    <div class="kpi-change ${kpi.positive ? 'positive' : 'negative'}">
                        ${kpi.positive ? '📈' : '📉'} ${kpi.change}
                    </div>
                </div>
            `).join('');
        }

        function renderCharts(headers, data) {
            const numericColumns = headers.filter(h => {
                const values = data.map(d => d[h]);
                return values.some(v => !isNaN(v) && v !== '');
            }).slice(1, 5); // Primeras 4 columnas numéricas

            const meses = data.map(d => d[headers[0]]);
            const chartsSection = document.getElementById('chartsSection');
            chartsSection.innerHTML = '';

            numericColumns.forEach(col => {
                const canvas = document.createElement('canvas');
                canvas.id = `chart-${col}`;
                
                const container = document.createElement('div');
                container.className = 'chart-container';
                container.innerHTML = `<h3>${col}</h3>`;
                container.appendChild(canvas);
                chartsSection.appendChild(container);

                const ctx = canvas.getContext('2d');
                const values = data.map(d => d[col]);
                
                if (charts[col]) charts[col].destroy();
                
                charts[col] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: meses,
                        datasets: [{
                            label: col,
                            data: values,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5,
                            pointBackgroundColor: '#667eea'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            });
        }

        function renderTable(headers, data) {
            const tableHead = document.getElementById('tableHead');
            const tbody = document.querySelector('#dataTable tbody');

            // Crear headers
            tableHead.innerHTML = `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>`;

            // Crear filas
            tbody.innerHTML = data.map(row => `
                <tr>${headers.map(h => `<td>${row[h]}</td>`).join('')}</tr>
            `).join('');
        }

        // Cargar URL guardada al iniciar
        window.addEventListener('load', () => {
            const savedUrl = localStorage.getItem('sheetUrl');
            if (savedUrl) {
                document.getElementById('sheetUrl').value = savedUrl;
                loadData();
            }
        });
    </script>
</body>
</html>
